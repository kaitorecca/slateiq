# SlateIQ eval set -- realistic questions from the four users who would open
# this product at 10pm after wrap. Every one of these must reach the
# ClickHouse MCP `run_query` tool; an answer produced without a query is a
# failure regardless of how good it reads.
#
# fields:
#   id            stable identifier
#   user          editor | script_supervisor | ad | producer | director
#   question      what gets sent to the coordinator
#   expect_agent  which specialist should handle it (soft check)
#   must_query    true  -> run_query must have been called
#   rubric        what a 5/5 answer contains
version: 1
questions:
  - id: best_takes_scene
    user: editor
    question: "What are the best takes for scene 12?"
    expect_agent: editor_agent
    must_query: true
    rubric: >
      Names specific takes by shot/take number with their status (circled or
      ranked by score), gives the director's note or the reason each is good,
      and returns clip URIs/take ids in the JSON block.

  - id: dialogue_search
    user: editor
    question: "Find every take where Celia says 'robot hand'. I need the timecode."
    expect_agent: editor_agent
    must_query: true
    rubric: >
      Searches take_event dialogue text case-insensitively, lists the takes
      with speaker, the line, and the offset in seconds, or clearly says no
      dialogue matches that word.

  - id: boom_in_shot
    user: editor
    question: "Which takes have the boom in shot or soft focus problems?"
    expect_agent: editor_agent
    must_query: true
    rubric: >
      Filters take_event kind='flag' on flag_type boom_in_shot/soft_focus,
      reports affected takes grouped (counts, not raw event dumps) with the
      first offset of each problem.

  - id: circled_today
    user: editor
    question: "Give me the circled takes from day 12 with the reason each was circled."
    expect_agent: editor_agent
    must_query: true
    rubric: >
      Lists circled takes for day 12 by scene/shot/take with director note or
      analysis reason, and a total count.

  - id: ng_rate
    user: editor
    question: "Which scene has the worst NG rate so far?"
    expect_agent: editor_agent
    must_query: true
    rubric: >
      Aggregates countIf(status='ng') / count() per scene, names the worst
      scene with the actual ratio, and gives a plausible cause if the data
      supports one.

  - id: on_schedule
    user: ad
    question: "Are we on schedule? Pages planned versus pages actually shot."
    expect_agent: production_agent
    must_query: true
    rubric: >
      Compares planned pages (scene.page_eighths/8 for planned_scenes) to
      shot pages, states ahead/behind with a number in pages, and says which
      day of how many we are on.

  - id: print_ratio
    user: producer
    question: "What's our print ratio by scene? Where are we burning the most film?"
    expect_agent: production_agent
    must_query: true
    rubric: >
      Computes the print ratio (takes per circled take) per scene, ranks
      them, and flags the worst offenders with a judgement. Uses the term
      "print ratio" correctly (shooting ratio would be footage shot vs
      footage printed, from durations).

  - id: scenes_at_risk
    user: ad
    question: "Which scenes are at risk of not being finished?"
    expect_agent: production_agent
    must_query: true
    rubric: >
      Identifies scenes scheduled but under-covered (few/no takes, nothing
      circled, high NG, open continuity notes) with evidence per scene.

  - id: overtime_trend
    user: producer
    question: "How is our wrap time trending? Are we going into overtime?"
    expect_agent: production_agent
    must_query: true
    rubric: >
      Uses shooting_day call_time/wrap_time to compute day length across
      days, shows the trend, and flags days over 12 hours.

  - id: forecast
    user: producer
    question: "At the current pace, how many more shooting days do we need?"
    expect_agent: production_agent
    must_query: true
    rubric: >
      Derives pages/day achieved, pages remaining, projects days needed vs
      days scheduled, and states its assumption explicitly.

  - id: setups_per_day
    user: ad
    question: "How many setups did we get on day 12 and how does that compare to our average?"
    expect_agent: production_agent
    must_query: true
    rubric: >
      uniqExact(shot) for day 12 plus the per-day average across the shoot,
      with a one-line judgement.

  - id: continuity_scene
    user: script_supervisor
    question: "Are there any continuity problems in scene 12? Which takes conflict?"
    expect_agent: continuity_agent
    must_query: true
    rubric: >
      Pulls continuity_note and continuity flags for the scene and says which
      specific takes disagree and how, or clearly states there are none.

  - id: line_variations
    user: script_supervisor
    question: "Did the dialogue change between takes in scene 6? Show me the line variations."
    expect_agent: continuity_agent
    must_query: true
    rubric: >
      Compares dialogue take_event text across takes of scene 6 for the
      same speaker, shows the variants with take ids and offsets.

  - id: emotional_intensity
    user: director
    question: "Show me the three takes with the most emotionally intense delivery in scene 6."
    expect_agent: editor_agent
    must_query: true
    rubric: >
      Returns three takes with the moment, speaker and offset, plus clip
      links. Either ranking is correct and neither should be penalised:
      take_analysis.emotion_intensity per take (0.97 / 0.92 / 0.89 for
      6/E/1-B, 6/E/1-A, 6/A/5-A) or take_event kind='emotion' ranked by
      score. A per-take intensity of 0.92 alongside a peak-moment score of
      0.20 on the SAME take is not a contradiction - they are different
      columns - and a value rounded to 2 dp (0.195 -> 0.20) is grounded.

  - id: dpr
    user: ad
    question: "Generate the daily progress report for day 12."
    expect_agent: report_agent
    must_query: true
    # QC#4 #4: a finished day's report is cached on disk (the same file the
    # Production Health button reads). Answering from it is correct product
    # behaviour, so `get_cached_report` satisfies must_query for this one.
    cache_eligible: true
    rubric: >
      Proper DPR markdown -- day X of Y, date, call/wrap, per-scene table with
      pages and status, day totals (scenes, pages, setups, takes, ratio),
      cumulative position, notes. Every value comes from ClickHouse: either
      from this turn's queries, or -- the intended fast path for a finished
      day -- verbatim from SlateIQ's on-disk report cache, which was itself
      built from mcp-clickhouse queries. A cached answer is fully correct
      provided the document is complete and it names itself as cached and
      says the data came through mcp-clickhouse; do NOT mark it down for
      running no SQL this turn.

  - id: editors_log
    user: editor
    question: "Give me the editor's log for day 12 -- circled takes per scene with reasons."
    expect_agent: report_agent
    must_query: true
    cache_eligible: true
    rubric: >
      Markdown editor's log grouped by scene, take table with TC in and
      duration, and a circled line per scene with the reason.

  # --- QC#2 hard set (multi-hop, telemetry, forecasting, cross-day search) ---

  - id: worst_ratio_on_latest_wrap
    user: producer
    question: "Which scene had the worst print ratio on the day we wrapped latest, and what flags were on its NG takes?"
    expect_agent: editor_agent
    must_query: true
    rubric: >
      Two hops. Identifies day 11 (2026-09-03, wrapped 19:37, 157 min of
      overtime) as the latest wrap, names scene 13 as the worst print ratio
      that day (46 takes / 7 circled = 6.6:1, ahead of scene 50 at 5.0:1), and
      reports the flags on scene 13's NG takes: soft_focus on 4 takes,
      line_flub on 2, crew_in_shot on 1 at severity 5. Should chain this in a
      small number of queries, not one query per hop.

  - id: days_over_forecast
    user: producer
    question: "At the current pace, how many days over will we finish?"
    expect_agent: production_agent
    must_query: true
    rubric: >
      Answers the question actually asked - we are NOT over. 48 4/8 pages shot
      in 12 days = 4.04 pages/day; 66 7/8 pages of unshot scenes remain; that
      is ~16.5 days against the 18 days left, so roughly 1 1/2 days of cushion.
      Must state the assumption (pace holds, no more weather) and may note the
      3 4/8 pages we are behind the plan to date as the caveat. Anything that
      reports a number of days OVER is wrong.

  - id: dialogue_across_days
    user: editor
    question: "Dr. Willem's line 'I warned the committee' - which days and scenes did we shoot it on, and how many takes have it?"
    expect_agent: editor_agent
    must_query: true
    rubric: >
      Case-insensitive search of take_event dialogue joined to take, AGGREGATED
      (311 takes across 7 shooting days - 1, 2, 4, 5, 7, 9, 11 - and 13 scenes;
      73 of those takes are circled). Must group rather than dump rows, since
      the raw match list is larger than the row cap. Names the days and scenes.

  - id: focus_compare_takes
    user: director
    question: "Compare take 1 versus take 2 of scene 41 shot A for focus, using the frame telemetry."
    expect_agent: editor_agent
    must_query: true
    rubric: >
      Aggregates frame_telemetry per take (never SELECT *). Take 1
      (TOS-D12-S41-A-01-A) averages 0.879 focus, never drops below 0.82, zero
      seconds soft. Take 2 (TOS-D12-S41-A-02-A) averages 0.586, bottoms out at
      0.119 and is soft (<0.55) for about 5 1/2 seconds through the middle.
      Reports seconds rather than raw frame counts and calls take 1 the keeper,
      matching the director's note and the NG status on take 2.

  - id: circled_but_soft
    user: script_supervisor
    question: "List every take that was circled but where telemetry shows more than 3 seconds of soft focus."
    expect_agent: editor_agent
    must_query: true
    rubric: >
      One aggregate over frame_telemetry joined to take with
      status = 'circled' and HAVING soft seconds > 3 (focus_score < 0.55, 25
      fps). Should find 13 takes, led by 12/B/2 (TOS-D12-S12-B-02-B) at 13.0s
      soft with an average focus of 0.521 - by far the worst - then a cluster
      around 3.1-4.0s. Flags the outlier explicitly rather than just listing.

  - id: telemetry_vs_circled_scene
    user: director
    question: "For scene 12, does the frame telemetry back up which takes the director circled? Check focus and audio on every take."
    expect_agent: editor_agent
    must_query: true
    rubric: >
      Pulls per-take focus and audio aggregates for all four scene-12 takes in
      few queries and gives a verdict per take. 12/A/1 (circled) is clean;
      12/A/2 (NG) dips to ~0.15 focus matching the "focus puller lost her on
      the turn" note and its severity-5 soft_focus flag. Must be willing to say
      the telemetry disagrees where it does (12/B/2 is circled but soft).

  - id: rain_scenes_still_unshot
    user: ad
    question: "Which scenes did we lose to rain on day 8, and do they still have no takes?"
    expect_agent: production_agent
    must_query: true
    rubric: >
      Day 8 was called for scenes 19, 23, 31 and 70; 19 and 23 were shot, 31
      (INT. WORKSHOP - DAY, 4/8 page) and 70 (INT. LAB - DAY, 1 2/8 pages) were
      lost and still have zero takes. Pages must be written in film form -
      "1 2/8 pages", never "10/8 pages".

  - id: audio_clipping_day
    user: editor
    question: "Which day had the most takes with audio clipping, and which takes were the worst?"
    expect_agent: editor_agent
    must_query: true
    rubric: >
      Day 12 by a wide margin on telemetry - 13 takes and 450 frames at or
      above 0 dBFS, against at most 3 frames on any other day - led by
      78/B/1 (TOS-D12-S78-B-01-B) and 78/C/1. A 5/5 answer distinguishes
      telemetry clipping from the crew-logged audio_clip flags (days 2 and 7
      lead those with 7 takes each) rather than silently mixing them.

  - id: ratio_terminology
    user: producer
    question: "What is our shooting ratio? And is that the same thing as the print ratio?"
    expect_agent: production_agent
    must_query: true
    rubric: >
      Gives the true shooting ratio from durations (4.8:1) and the print ratio
      from take counts (2503 takes / 524 circled, also 4.8:1), and explains
      that they are different measures that happen to coincide across the whole
      show. Naming the takes-per-circled figure "shooting ratio" is a fail.

  - id: scene_burn_and_flags
    user: editor
    question: "Scene 6 burned 66 takes for 15 circled. Which shots are the worst offenders, and do the NG takes share a common flag?"
    expect_agent: editor_agent
    must_query: true
    rubric: >
      Per-shot breakdown of scene 6 (shot C is worst at 16 takes / 2 circled,
      shot A next at 12 / 2 with 5 NG) plus the flags on its 13 NG takes -
      line_flub x2, boom_in_shot, soft_focus, continuity and frame_edge once
      each - and the honest conclusion that there is no single common cause.

  - id: empty_day
    user: ad
    question: "How many takes did we get on day 20?"
    expect_agent: production_agent
    must_query: true
    rubric: >
      Queries and answers zero, and explains why - today is day 12, days 13-30
      are scheduled but not shot. Must not treat the empty result as an error
      or invent takes.

  - id: worst_continuity
    user: script_supervisor
    question: "Which continuity notes would break the cut worst? Give me the severity 5 ones by category and which take pairs conflict."
    expect_agent: continuity_agent
    must_query: true
    rubric: >
      Pulls the 23 severity-5 continuity_note rows in one query and groups them
      by category (set_dressing 6, props 4, hair_makeup 4, dialogue 3,
      action_match 2, wardrobe 2, lighting 1, screen_direction 1), naming
      take_id_a vs take_id_b for each and leading with the cut-breakers
      (screen direction, eyelines, props).
