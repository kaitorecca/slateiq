<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
  .stage{padding:64px 90px 128px;justify-content:flex-start}
  .head{display:flex;align-items:baseline;gap:22px;margin-bottom:26px}
  .head h2{font-size:32px;font-weight:600}
  .head .m{font-size:19px;color:var(--faint)}
  .cols{display:grid;grid-template-columns:660px 1fr;gap:34px;flex:1;min-height:0}
  .pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
  .pane > .ph{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);
       font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--slate)}
  video{width:100%;flex:1;min-height:0;object-fit:cover;display:block;background:#000}
  .meters{padding:18px;display:grid;gap:14px;border-top:1px solid var(--line);background:var(--cell)}
  .meter{display:grid;grid-template-columns:150px 1fr 92px;align-items:center;gap:14px;font-size:17px;color:var(--dim)}
  .bar{height:9px;background:var(--raise);border-radius:5px;overflow:hidden}
  .bar i{display:block;height:100%;border-radius:5px;transition:width .1s linear}
  .val{text-align:right;color:var(--ink)}
  #json{flex:1;overflow:hidden;padding:16px 20px;font-size:17.5px;line-height:1.5;white-space:pre-wrap;color:var(--dim)}
  #json .k{color:var(--hold)} #json .s{color:var(--circled)} #json .n{color:var(--slate)}
  .rows{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 24px}
  .row .k{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .row .v{font-size:52px;font-weight:700;color:var(--slate);margin-top:8px;font-variant-numeric:tabular-nums}
  .row .t{font-size:15px;color:var(--faint);margin-top:4px}
</style>
<div class="stage">
  <div class="head"><h2>Ingest</h2><span class="m mono">gemini-3.5-flash · multimodal · response_schema → ClickHouse</span></div>
  <div class="cols">
    <div class="pane">
      <div class="ph"><span class="dot"></span>TOS-D12-S12-A-01-A · 15.2 s</div>
      <video id="v" src="clips/TOS-D12-S12-A-01-A.mp4" muted playsinline></video>
      <div class="meters">
        <div class="meter"><span>focus_score</span><span class="bar"><i id="mf" style="background:var(--circled);width:0"></i></span><span class="val" id="vf">—</span></div>
        <div class="meter"><span>exposure_ev</span><span class="bar"><i id="me" style="background:var(--slate);width:0"></i></span><span class="val" id="ve">—</span></div>
        <div class="meter"><span>audio_peak_db</span><span class="bar"><i id="ma" style="background:var(--hold);width:0"></i></span><span class="val" id="va">—</span></div>
        <div class="meter" style="color:var(--faint);font-size:15px"><span>25 samples / s</span><span></span><span class="val mono" id="vn">0</span></div>
      </div>
    </div>
    <div class="pane">
      <div class="ph"><span class="dot" style="background:var(--hold)"></span>Gemini response · structured</div>
      <div id="json" class="mono"></div>
    </div>
  </div>
  <div class="rows">
    <div class="row"><div class="k">take</div><div class="v" id="c1">0</div><div class="t">slates, 12 shooting days</div></div>
    <div class="row"><div class="k">take_event</div><div class="v" id="c2">0</div><div class="t">dialogue · action · flags</div></div>
    <div class="row"><div class="k">frame_telemetry</div><div class="v" id="c3">0</div><div class="t">25 measurements per second</div></div>
  </div>
</div>
<script>
const JSON_TEXT = [
 '{',
 '  "take_id": "TOS-D12-S12-A-01-A",',
 '  "transcript": [',
 '    { "start": 0.0, "end": 5.2, "speaker": "MAN",',
 '      "text": "Celia, we have to follow our passions." },',
 '    { "start": 5.3, "end": 9.2, "speaker": "CELIA",',
 '      "text": "Why don\'t you just admit that you\'re",',
 '              "freaked out by my robot hand?" }',
 '  ],',
 '  "emotions": [ { "label": "defiance", "intensity": 0.7 } ],',
 '  "flags":    [ { "type": "soft_focus", "severity": 3 } ],',
 '  "quality_score": 8.5,',
 '  "recommended": true',
 '}',
].join('\n');

const el = document.getElementById('json');
let i = 0;
const paint = (s) => s
  .replace(/"([a-z_]+)":/g, '<span class="k">"$1"</span>:')
  .replace(/: (\d+\.?\d*|true|false)/g, ': <span class="n">$1</span>');
const type = setInterval(() => {
  i += 4;
  el.innerHTML = paint(JSON_TEXT.slice(0, i));
  if (i >= JSON_TEXT.length) clearInterval(type);
}, 22);

const v = document.getElementById('v');
v.play();
let n = 0;
setInterval(() => {
  const t = v.currentTime || 0;
  const f = 0.55 + 0.33 * Math.sin(t * 1.7) + 0.07 * Math.sin(t * 9);
  const e = 0.5 + 0.2 * Math.sin(t * 0.9);
  const a = 0.35 + 0.45 * Math.abs(Math.sin(t * 5.5));
  mf.style.width = (f * 100).toFixed(0) + '%'; vf.textContent = f.toFixed(3);
  me.style.width = (e * 100).toFixed(0) + '%'; ve.textContent = (e * 6 - 3).toFixed(1) + ' EV';
  ma.style.width = (a * 100).toFixed(0) + '%'; va.textContent = (-42 + a * 30).toFixed(1) + ' dB';
  mf.style.background = f < 0.55 ? 'var(--ng)' : 'var(--circled)';
  vn.textContent = (n += 3).toLocaleString();
}, 40);

// counters settle on the exact figures the database actually holds
const TARGETS = { c1: 2503, c2: 26750, c3: 3074957 };
const START = performance.now(), DUR = 6200;
(function tick(now) {
  const p = Math.min(1, ((now || START) - START) / DUR);
  const k = 1 - Math.pow(1 - p, 3);
  for (const [id, target] of Object.entries(TARGETS))
    document.getElementById(id).textContent = Math.round(target * k).toLocaleString();
  if (p < 1) requestAnimationFrame(tick);
})();
window.__duration = 21000;
</script>
